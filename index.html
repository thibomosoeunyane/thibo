
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Loading Screen</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            font-family: Arial, sans-serif;
            color: white;
        }

        .video-container {
            position: relative;
            width: 100%;
            max-width: 1000px;
            margin: 40px auto;
            aspect-ratio: 16 / 9;
            background: #111;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .loader-screen {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            z-index: 2;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 5px solid #333;
            border-top-color: #00aaff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .loading-text {
            font-size: 16px;
            color: #fff;
        }

        .progress-bar {
            width: 180px;
            height: 4px;
            background: #444;
            overflow: hidden;
            border-radius: 5px;
        }

        .progress {
            height: 100%;
            width: 30%;
            background: #00aaff;
            animation: progress 1.5s ease-in-out infinite;
        }

        .hidden {
            display: none !important;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes progress {
            0%   { transform: translateX(-100%); }
            100% { transform: translateX(600%); }
        }

        h2 {
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h2>My Video Player</h2>

    <div class="video-container">

        <div class="loader-screen" id="loader">
            <div class="spinner"></div>
            <p class="loading-text" id="loadingText">
                Loading video...
            </p>
            <div class="progress-bar">
                <div class="progress"></div>
            </div>
        </div>

        <video id="myVideo" controls preload="auto">
            <source src="myvideo.mp4" type="video/mp4">
            Your browser does not support video playback.
        </video>

    </div>

    <script>
        const video = document.getElementById("myVideo");
        const loader = document.getElementById("loader");
        const loadingText = document.getElementById("loadingText");

        video.addEventListener("waiting", () => {
            loader.classList.remove("hidden");
            loadingText.textContent = "Buffering video...";
        });

        video.addEventListener("playing", () => {
            loader.classList.add("hidden");
        });

        video.addEventListener("canplay", () => {
            loader.classList.add("hidden");
        });

        video.addEventListener("error", () => {
            loader.classList.remove("hidden");
            loadingText.textContent =
                "Video failed to load. Check the video file.";
        });
    </script>

</body>
</html>
